<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - Contest Arena</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#0f172a">
  <meta name="theme-color" content="#050505">
    <link rel="stylesheet" href="./css/contest-editor.css?v=4">
    <link rel="stylesheet" href="./css/nav.css">
</head>
<body>
  <div class="contest-arena" id="arena">
    <!-- Top Bar -->
    <div class="arena-topbar">
      <a class="brand" href="index.html">
        <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
        <span class="brand-text">AlgoForge</span>
      </a>
      <div class="arena-info">
        <span class="arena-title" id="arenaTitle">Loading...</span>
        <span class="arena-timer" id="arenaTimer">--:--</span>
      </div>
      <div class="topbar-actions">
        <a href="contests.html" class="btn btn-secondary" style="font-size:12px">Back to Contests</a>
        <button id="panelToggle" class="panel-toggle" title="Toggle side panels" aria-pressed="false">☰</button>
      </div>
    </div>

    <!-- Time progress bar -->
    <div class="time-progress-wrap">
      <div class="time-progress-bar" id="timeProgressBar"></div>
    </div>

    <!-- Body -->
    <div class="arena-body">
      <!-- Left sidebar - Problems -->
      <div class="arena-panel arena-left" id="leftPanel">
        <div class="arena-sidebar">
        <div class="sidebar-header">Problems</div>
        <div class="problem-search">
          <input type="text" id="problemSearchInput" placeholder="Search problems..." class="sidebar-search-input">
          <div class="sidebar-filters">
            <button class="sidebar-filter-btn active" data-filter="all">All</button>
            <button class="sidebar-filter-btn easy" data-filter="easy">Easy</button>
            <button class="sidebar-filter-btn medium" data-filter="medium">Med</button>
            <button class="sidebar-filter-btn hard" data-filter="hard">Hard</button>
          </div>
        </div>
        <div class="problem-list" id="problemList">
          <p style="font-size:13px;color:#64748b;padding:12px">Loading problems...</p>
        </div>
        </div>
      </div>

      <div class="splitter vertical" id="splitterLeft" role="separator" aria-orientation="vertical" aria-label="Resize problems panel"></div>

      <!-- Center - Problem description + editor -->
      <div class="arena-panel arena-center" id="centerPanel" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
        <div class="arena-problem" id="problemView">
          <div class="problem-header">
            <h2 id="probTitle">Loading problem...</h2>
            <div class="problem-meta" id="probMeta"></div>
          </div>
          <div class="problem-desc" id="probDesc"></div>
          <div class="problem-example" id="probExample" style="display:none"></div>
          <ul class="problem-constraints" id="probConstraints" style="display:none"></ul>
        </div>
      
          <!-- Horizontal splitter between problem and editor -->
          <div class="splitter horizontal" id="splitterCenter" role="separator" aria-orientation="horizontal" aria-label="Resize problem and editor"></div>

          <!-- Code editor -->
          <div class="code-section">
          <div class="code-toolbar">
            <select id="languageSelect">
              <option value="cpp">C++</option>
              <option value="c">C</option>
              <option value="java">Java</option>
              <option value="js">JavaScript</option>
            </select>
            <div class="code-toolbar-buttons">
              <button class="btn btn-ghost" id="resetBtn" title="Reset to boilerplate">↺ Reset</button>
              <button class="btn btn-secondary" id="runBtn">Run</button>
              <button class="btn btn-primary" id="submitBtn">Submit</button>
            </div>
          </div>
          <div class="code-editor-wrap" id="codeEditor"></div>
        </div>
      </div>

      <div class="splitter vertical" id="splitterRight" role="separator" aria-orientation="vertical" aria-label="Resize leaderboard panel"></div>

      <!-- Right sidebar - Leaderboard -->
      <div class="arena-panel arena-right" id="rightPanel">
        <div class="arena-leaderboard">
        <div class="leaderboard-header">Leaderboard</div>
        <div class="leaderboard-list" id="leaderboardList">
          <p style="font-size:13px;color:#64748b;padding:12px">Loading...</p>
        </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Results overlay -->
  <div class="results-overlay" id="resultsOverlay">
    <div class="results-modal">
      <div id="resultsContent"></div>
      <button class="btn btn-secondary" style="margin-top:16px;width:100%" id="closeResults">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/design/nav.js?v=3"></script>
  <script>
    // Override initAppNav to not render in this page
    window.initAppNav = function() {};
  </script>
  <script src="./scripts/contests/contest-editor.js?v=4"></script>
</body>
</html>
