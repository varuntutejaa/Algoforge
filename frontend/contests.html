<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - Contests</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#0f172a">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="./css/nav.css?v=3">
  <link rel="stylesheet" href="./css/contest.css?v=3">
</head>
<body>
  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
    <div class="nav-center" id="navCenter"></div>
    <div id="profileNav"></div>
  </nav>

  <main class="contests-page">
    <header class="contests-header">
      <span class="section-kicker">Competitive Arena</span>
      <h1>Contests</h1>
      <p>Create timed coding contests, join with a code, and compete on the leaderboard.</p>
    </header>

    <!-- Tabs -->
    <div class="contests-tabs">
      <button class="active" data-tab="my">My Contests</button>
      <button data-tab="create">Create</button>
      <button data-tab="join">Join</button>
    </div>

    <div class="contests-search" id="contestsSearch" style="display:none">
      <input type="text" id="contestSearchInput" placeholder="Search contests by title or code..." class="search-input">
      <div class="filter-row">
        <div class="status-filters" id="statusFilters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn active-status" data-status="active">Active</button>
          <button class="filter-btn upcoming-status" data-status="upcoming">Upcoming</button>
          <button class="filter-btn ended-status" data-status="ended">Ended</button>
        </div>
      </div>
      <div class="results-count" id="contestResultsCount"></div>
    </div>

    <!-- My Contests Panel -->
    <section class="contest-panel active" id="panelMy">
      <div id="myContestsList"></div>
    </section>

    <!-- Create Contest Panel -->
    <section class="contest-panel" id="panelCreate">
      <form class="contest-form-layout" id="createForm">
        <div class="contest-form-left">
          <div class="form-group">
            <label for="contestTitle">Contest Title</label>
            <input type="text" id="contestTitle" placeholder="e.g. Weekly DSA Challenge" required>
          </div>

          <div class="form-group">
            <label for="contestDesc">Description (optional)</label>
            <textarea id="contestDesc" placeholder="Describe the contest rules or theme..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
              <label for="startTime">Start Time</label>
              <input type="time" id="startTime" required>
            </div>
            <div class="form-group">
              <label for="duration">Duration (min)</label>
              <input type="number" id="duration" min="1" value="60" required>
            </div>
          </div>

          <div class="form-group">
            <label for="problemMode">Problem Selection</label>
            <select id="problemMode">
              <option value="choose">Choose specific problems</option>
              <option value="random">Pick random problems</option>
            </select>
          </div>

          <div class="form-group" id="randomCountGroup" style="display:none">
            <label for="randomCount">Number of random problems</label>
            <input type="number" id="randomCount" min="1" max="10" value="3">
          </div>

          <button type="submit" class="btn btn-primary" id="createBtn">Create Contest</button>
          <p class="form-hint" id="createStatus"></p>
        </div>

        <div class="contest-form-right" id="chooseProblemsGroup">
          <label>Select Problems</label>
          <div class="problem-picker-toolbar">
            <input type="text" id="problemFilterInput" placeholder="Search problems..." class="problem-search-input">
            <div class="problem-difficulty-filters" id="problemDiffFilters">
              <button class="pf-diff-btn active" data-diff="all">All</button>
              <button class="pf-diff-btn easy" data-diff="Easy">Easy</button>
              <button class="pf-diff-btn medium" data-diff="Medium">Med</button>
              <button class="pf-diff-btn hard" data-diff="Hard">Hard</button>
            </div>
            <div class="problem-tag-filters" id="problemTagFilters"></div>
            <div class="problem-picker-meta">
              <span id="problemCountLabel"></span>
              <div class="problem-picker-actions">
                <button type="button" class="pf-action-btn" id="selectAllProblems">Select All</button>
                <button type="button" class="pf-action-btn" id="deselectAllProblems">Deselect All</button>
              </div>
            </div>
          </div>
          <div class="problem-checkboxes" id="problemCheckboxes"></div>
        </div>
      </form>
    </section>

    <!-- Join Contest Panel -->
    <section class="contest-panel" id="panelJoin">
      <div class="join-section">
        <input type="text" id="joinCode" placeholder="Enter contest code (e.g. AB12CD)" maxlength="6">
        <button class="btn btn-primary" id="joinBtn">Join</button>
      </div>
      <p class="form-hint" id="joinStatus"></p>

      <h3 style="font-size:16px;font-weight:700;color:#f8fafc;margin-bottom:12px">Available Contests</h3>
      <div id="availableContests"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/design/nav.js?v=3"></script>
  <script src="./scripts/contests/contests.js?v=3"></script>
</body>
</html>
