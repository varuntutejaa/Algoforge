<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - Contest Calendar</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#0f172a">
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/calendar.css">
</head>
<body>
  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
    <div class="nav-center" id="navCenter"></div>
    <div id="profileNav"></div>
  </nav>

  <div class="cal-layout">

    <!-- Left Sidebar -->
    <aside class="cal-sidebar">
      <div class="mini-cal">
        <div class="mini-cal-header">
          <button class="mini-nav-btn" id="miniPrev">&#8249;</button>
          <span class="mini-month-label" id="miniMonthLabel"></span>
          <button class="mini-nav-btn" id="miniNext">&#8250;</button>
        </div>
        <div class="mini-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <div class="sidebar-upcoming">
        <h3 class="sidebar-section-title">Upcoming Contests</h3>
        <div id="upcomingList"><p class="sidebar-empty">Loading…</p></div>
      </div>
    </aside>

    <!-- Main Calendar -->
    <div class="cal-main">

      <!-- Toolbar -->
      <div class="cal-toolbar">
        <div class="cal-toolbar-left">
          <button class="cal-today-btn" id="calToday">Today</button>
          <button class="cal-nav-btn" id="calPrev">&#8249;</button>
          <button class="cal-nav-btn" id="calNext">&#8250;</button>
          <h2 class="cal-title" id="calTitle"></h2>
        </div>
        <div class="cal-toolbar-right">
          <div class="platform-filters" id="platformFilters">
            <button class="pf-btn active" data-platform="algoforge">AlgoForge</button>
            <button class="pf-btn cf active" data-platform="codeforces">Codeforces</button>
            <button class="pf-btn lc active" data-platform="leetcode">LeetCode</button>
            <button class="pf-btn cc active" data-platform="codechef">CodeChef</button>
          </div>
          <div class="view-switcher">
            <button class="view-btn active" data-view="month">Month</button>
            <button class="view-btn" data-view="week">Week</button>
            <button class="view-btn" data-view="day">Day</button>
          </div>
        </div>
      </div>

      <!-- Month View -->
      <div class="cal-month-view" id="calMonthView">
        <div class="month-weekday-header">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </div>

      <!-- Week View -->
      <div class="cal-week-view" id="calWeekView" style="display:none">
        <div class="week-header" id="weekHeader"></div>
        <div class="week-body">
          <div class="week-time-col" id="weekTimeCol"></div>
          <div class="week-cols" id="weekCols"></div>
        </div>
      </div>

      <!-- Day View -->
      <div class="cal-day-view" id="calDayView" style="display:none">
        <div class="day-body">
          <div class="day-time-col" id="dayTimeCol"></div>
          <div class="day-col-wrap" id="dayColWrap">
            <div class="day-col" id="dayCol"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Event Detail Panel -->
  <div class="event-panel" id="eventPanel">
    <button class="event-panel-close" id="eventPanelClose">&times;</button>
    <div class="event-panel-inner" id="eventPanelInner"></div>
  </div>
  <div class="event-panel-backdrop" id="eventPanelBackdrop"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/design/nav.js"></script>
  <script src="./scripts/contests/calendar.js"></script>
</body>
</html>
