<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - Problems</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/problems.css?v=6">
</head>
<body>
  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
    <div class="nav-center" id="navCenter"></div>
    <div id="profileNav"></div>
  </nav>

  <main class="problems-page">

    <!-- Daily Challenge -->
    <div class="daily-card" id="dailyCard">
      <div class="daily-loading">Loading today's challenge…</div>
    </div>

    <!-- Panel -->
    <div class="problems-panel">

      <!-- Search + filters -->
      <div class="panel-filters">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="#64748b" stroke-width="1.6"/><path d="M13 13l3.5 3.5" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search by title or topic…" class="search-input" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
        </div>
        <div class="filter-row">
          <div class="diff-group" id="difficultyFilters">
            <button class="diff-btn active" data-difficulty="all">All</button>
            <button class="diff-btn easy"   data-difficulty="easy">Easy</button>
            <button class="diff-btn medium" data-difficulty="medium">Medium</button>
            <button class="diff-btn hard"   data-difficulty="hard">Hard</button>
          </div>
          <div class="tag-scroll" id="tagFilters">
            <button class="tag-btn active" data-tag="all">All Topics</button>
          </div>
        </div>
        <div class="results-meta" id="resultsMeta"></div>
      </div>

      <!-- Table header -->
      <div class="prob-table-head">
        <span class="col-status"></span>
        <span class="col-num">#</span>
        <span class="col-title">Title</span>
        <span class="col-tags">Topics</span>
        <span class="col-diff">Difficulty</span>
      </div>

      <!-- Rows -->
      <div class="prob-table-body" id="problemsList"></div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/design/nav.js?v=3"></script>
  <script src="./scripts/problem/problems.js?v=4"></script>
</body>
</html>
