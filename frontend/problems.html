<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - Problems</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#0f172a">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/problems.css?v=3">
</head>
<body>
  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
    <div class="nav-center" id="navCenter"></div>
    <div id="profileNav"></div>
  </nav>

  <main class="problems-page">
    <header class="problems-header">
      <span class="section-kicker">Practice Arena</span>
      <h1>Problems List</h1>
      <p>Select a challenge and open the code editor with starter boilerplate for C, C++, Java, and JavaScript.</p>
    </header>

    <div class="problems-filters">
      <input type="text" id="searchInput" placeholder="Search problems by title or tag..." class="search-input">
      <div class="filter-row">
        <div class="difficulty-filters" id="difficultyFilters">
          <button class="filter-btn active" data-difficulty="all">All</button>
          <button class="filter-btn easy" data-difficulty="easy">Easy</button>
          <button class="filter-btn medium" data-difficulty="medium">Medium</button>
          <button class="filter-btn hard" data-difficulty="hard">Hard</button>
        </div>
        <div class="tag-filters" id="tagFilters">
          <button class="tag-btn active" data-tag="all">All Tags</button>
        </div>
      </div>
      <div class="results-count" id="resultsCount"></div>
    </div>

    <section class="problems-list" id="problemsList">
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/design/nav.js?v=3"></script>
  <script src="./scripts/problem/problems.js?v=3"></script>
</body>
</html>
