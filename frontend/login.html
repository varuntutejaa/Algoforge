<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoForge — Sign In</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#050505">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>

  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
  </nav>

  <main class="page auth-page">

    <section class="form-panel">
      <div class="form-card">

        <div class="form-header">
          <p class="form-eyebrow">// welcome back</p>
          <h2 class="form-title">Sign in</h2>
          <p class="form-sub">Access your forge. Continue building.</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>

          <!-- Email -->
          <div class="field-group" id="emailGroup">
            <label for="email" class="field-label">Email</label>
            <div class="field-wrap">
              <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" id="email" name="email" class="field-input" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <p class="field-error" id="emailError"></p>
          </div>

          <!-- Password -->
          <div class="field-group" id="passwordGroup">
            <label for="password" class="field-label">
              Password
              <a href="fpass.html" class="forgot-link">Forgot?</a>
            </label>
            <div class="field-wrap">
              <svg class="field-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" name="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                <svg class="eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <!-- Remember me -->
          <div class="remember-row">
            <label class="check-label">
              <input type="checkbox" id="remember" name="remember" class="check-input" />
              <span class="checkmark"></span>
              <span>Remember me</span>
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="btn-label">Sign In</span>
            <span class="btn-loader" id="btnLoader" style="display:none"></span>
            <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>

          <!-- Divider -->
          <div class="divider"><span>or continue with</span></div>

          <!-- OAuth -->
          <div class="oauth-row">
            <button type="button" class="oauth-btn" id="googleBtn">
              <svg width="17" height="17" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google
            </button>
          </div>

        </form>

        <p class="signup-prompt">
          New to AlgoForge? <a href="signup.html" class="signup-link">Create account</a>
        </p>

      </div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/design/toast.js"></script>
  <script src="./scripts/config.js?v=2"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/auth/login.js?v=3"></script>
</body>
</html>
