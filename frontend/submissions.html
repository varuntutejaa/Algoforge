<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoForge - My Submissions</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/algoforge_favicon_themed.svg">
  <link rel="shortcut icon" href="./assets/algoforge_favicon_themed.svg">
  <meta name="theme-color" content="#0f172a">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="./css/nav.css">
  <link rel="stylesheet" href="./css/submissions.css">
</head>
<body>
  <nav class="app-navbar">
    <a class="brand" href="index.html">
      <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
      <span class="brand-text">AlgoForge</span>
    </a>
    <div class="nav-center" id="navCenter"></div>
    <div id="profileNav"></div>
  </nav>

  <main class="submissions-page">
    <header class="submissions-header">
      <span class="section-kicker">Submission History</span>
      <h1>My Submissions</h1>
      <p>Review your latest submissions, verdicts, and performance.</p>
    </header>

    <section class="filters-bar">
      <label for="verdictFilter">Filter by verdict</label>
      <select id="verdictFilter">
        <option value="All">All</option>
        <option value="Accepted">Accepted</option>
        <option value="Wrong Answer">Wrong Answer</option>
        <option value="Runtime Error">Runtime Error</option>
        <option value="Compile Error">Compile Error</option>
      </select>
    </section>

    <section class="submissions-table-wrap">
      <table class="submissions-table">
        <thead>
          <tr>
            <th>Problem</th>
            <th>Language</th>
            <th>Verdict</th>
            <th>Runtime</th>
            <th>Memory</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="submissionsBody">
          <tr>
            <td colspan="6">Loading submissions...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="./scripts/design/nav.js"></script>
  <script src="./scripts/dashboard/submissions.js"></script>
</body>
</html>
