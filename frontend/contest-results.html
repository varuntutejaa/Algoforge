<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AlgoForge - Contest Results</title>
  <link rel="icon" href="./assets/algoforge_favicon_themed.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="./assets/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="mask-icon" href="./assets/algoforge_favicon_themed.svg" color="#0f172a">
  <link rel="stylesheet" href="./css/contest-editor.css">
  <link rel="stylesheet" href="./css/nav.css">
</head>
<body>
  <div class="contest-results-page">
    <div class="arena-topbar">
      <a class="brand" href="index.html">
        <img src="./assets/algoforge_favicon_themed.svg" alt="AlgoForge" class="brand-icon">
        <span class="brand-text">AlgoForge</span>
      </a>
      <div id="profileNav"></div>
    </div>

    <main class="results-body" style="padding:24px">
      <h1 id="resultsTitle">Contest Results</h1>
      <p id="resultsSubtitle" style="color:#94a3b8;margin-top:6px"></p>

      <div class="results-card" style="margin-top:18px">
        <div id="leaderboardContainer">
          <p style="color:#64748b">Loading leaderboard...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="./scripts/auth/firebase-config.js"></script>
  <script src="./scripts/config.js"></script>
  <script src="./scripts/design/nav.js"></script>
  <script>
    window.initAppNav = window.initAppNav || function(){};
  </script>
  <script src="./scripts/contests/contest-results.js"></script>
</body>
</html>
