<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlgoForge Login</title>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>

  <div class="container">
    
    <div class="logo">⚡</div>

    <h1>AlgoForge</h1>

    <p class="subtitle">
      Build. Solve. Improve.
    </p>

    <form class="login-form">

      <input 
        type="email" 
        id="email"
        placeholder="Email"
        required
      />

      <div class="password-box">
        <input 
          type="password" 
          id="password"
          placeholder="Password"
          required
        />

        <button type="button" id="toggle">
          Show
        </button>
      </div>

      <button class="login-btn">
        Sign In
      </button>

    </form>

  </div>

  <script src="Login.js"></script>
</body>
</html>
