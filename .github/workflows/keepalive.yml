name: Keep-alive

# Render's free tier spins the backend down after ~15 minutes without
# inbound traffic, giving the next visitor a 30-50s cold start. This ping
# keeps the service warm and re-warms the external contest-calendar caches.
#
# GitHub Actions cron cannot run more often than every 5 minutes (and the
# scheduler routinely adds delay); every 10 minutes is comfortably inside
# Render's idle window. For a strict 1-minute heartbeat use an external
# pinger (e.g. cron-job.org) pointed at the same /health URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://algoforge-backend-eeso.onrender.com/health" || echo 000)
          echo "health: HTTP $code"
          # A cold start can exceed the first request's timeout — retry once.
          if [ "$code" != "200" ]; then
            sleep 20
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://algoforge-backend-eeso.onrender.com/health" || echo 000)
            echo "health (retry): HTTP $code"
          fi
          [ "$code" = "200" ]

      - name: Re-warm contest calendar caches
        run: |
          for ep in codeforces-contests leetcode-contests codechef-contests atcoder-contests hackerrank-contests; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://algoforge-backend-eeso.onrender.com/api/$ep" || echo 000)
            echo "$ep: HTTP $code"
          done
