name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # Security scanning — repo-wide, independent of the per-project CI jobs
  # ------------------------------------------------------------------
  security-scan:
    name: Security scan (secrets + filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan (fails only on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ------------------------------------------------------------------
  # Backend CI — deploys itself via Render's GitHub auto-deploy on push
  # to main (render.yaml blueprint), not from this workflow.
  # ------------------------------------------------------------------
  ci-backend:
    name: Backend CI (lint, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dependency vulnerability audit (fails on new high/critical)
        run: npm run audit

      - name: Job summary
        if: always()
        run: |
          echo "### Backend CI: lint + test + audit ran for \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Frontend CI — deployed separately via `vercel --prod` (not yet wired
  # to GitHub auto-deploy from this workflow).
  # ------------------------------------------------------------------
  ci-frontend:
    name: Frontend CI (lint, test, audit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Dependency vulnerability audit (fails on new high/critical, prod deps only)
        run: npm run audit

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Job summary
        if: always()
        run: |
          echo "### Frontend CI: lint + test + audit + build ran for \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
