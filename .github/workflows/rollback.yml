name: Manual Rollback

# Complements the *automatic* rollback already built into
# backend/scripts/deploy/release.sh (which triggers when the post-deploy
# health check fails). This workflow is for the other case: the deploy
# looked healthy, but a bug surfaced later and you need to revert on demand.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to roll back"
        type: choice
        options: [production, staging]
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back backend (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::472888338171:role/AlgoForgeGitHubActionsRole
          aws-region: ap-south-1

      - name: Run rollback.sh via SSM
        id: rollback
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Manual rollback triggered by ${{ github.actor }}" \
            --parameters 'commands=["bash /home/ec2-user/backend/shared/scripts/rollback.sh"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Rollback failed — manual intervention required. Output:"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text >&2
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for SSM command"
          exit 1

      - name: External health check after rollback
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${{ vars.BACKEND_PUBLIC_URL }}/health" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Backend still unhealthy after rollback"
          exit 1

      - name: Notify Slack
        if: ${{ always() && vars.SLACK_WEBHOOK_CONFIGURED == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' --data "$(node -e '
            const payload = {
              text: `🔁 Manual rollback (${process.env.ENVIRONMENT}) — ${process.env.RESULT}`,
              blocks: [{ type: "section", text: { type: "mrkdwn",
                text: `🔁 *Manual rollback — ${process.env.RESULT}*\n` +
                      `*Environment:* ${process.env.ENVIRONMENT}\n` +
                      `*Triggered by:* ${process.env.AUTHOR}\n` +
                      `*Run:* <${process.env.RUN_URL}|View on GitHub Actions>`
              }}]
            };
            console.log(JSON.stringify(payload));
          ')" "$SLACK_WEBHOOK_URL"
