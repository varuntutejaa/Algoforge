<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AlgoForge — Signup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signup.css" />

</head>

<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main class="page">

    <!-- LEFT -->
    <section class="brand-panel">

      <div class="brand-inner">

        <div class="logo">
          <span class="logo-bracket">{</span>
          <span class="logo-af">AF</span>
          <span class="logo-bracket">}</span>
        </div>

        <h1 class="brand-name">
          AlgoForge
        </h1>

        <p class="brand-tagline">
          Forge your coding journey.<br>
          Build. Compete. Improve.
        </p>

        <ul class="feature-list">
          <li><span class="feat-dot"></span>Track DSA Progress</li>
          <li><span class="feat-dot"></span>Live Coding Contests</li>
          <li><span class="feat-dot"></span>AI Code Reviewer</li>
        </ul>

        <div class="terminal-block">

          <div class="terminal-bar">
            <span class="t-dot red"></span>
            <span class="t-dot yellow"></span>
            <span class="t-dot green"></span>

            <span class="t-label">
              algoforge ~ bash
            </span>
          </div>

          <div class="terminal-body">
            <span class="t-prompt">$ </span>
            <span class="t-cmd">
              forge --signup
            </span>
            <span class="t-cursor">▋</span>
          </div>

        </div>

      </div>

    </section>

    <!-- RIGHT -->
    <section class="form-panel">

      <div class="form-card">

        <div class="form-header">

          <p class="form-eyebrow">
            // create account
          </p>

          <h2 class="form-title">
            Sign up
          </h2>

          <p class="form-sub">
            Start building with AlgoForge.
          </p>

        </div>

        <form id="signupForm" class="signup-form">

          <!-- NAME -->
          <div class="field-group">

            <label class="field-label">
              Full Name
            </label>

            <input
              type="text"
              id="name"
              class="field-input"
              placeholder="Your Name"
              required
            />

          </div>

          <!-- EMAIL -->
          <div class="field-group">

            <label class="field-label">
              Email
            </label>

            <input
              type="email"
              id="email"
              class="field-input"
              placeholder="you@example.com"
              required
            />

          </div>

          <!-- PASSWORD -->
          <div class="field-group">

            <label class="field-label">
              Password
            </label>

            <input
              type="password"
              id="password"
              class="field-input"
              placeholder="••••••••"
              required
            />

          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="field-group">

            <label class="field-label">
              Confirm Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              class="field-input"
              placeholder="••••••••"
              required
            />

          </div>

          <!-- BUTTON -->
          <button type="submit" class="submit-btn">

            Create Account

          </button>

        </form>

        <p class="bottom-text">

          Already have an account?

          <a href="login.html">
            Login
          </a>

        </p>

      </div>

    </section>

  </main>

  <script src="signup.js"></script>

</body>

</html>
