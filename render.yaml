services:
  - type: web
    name: algoforge-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: SUPABASE_URL
        value: https://aqhbkduywhftcfndksff.supabase.co
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://djpb60zs17m9t.cloudfront.net,https://frontend-xi-orpin-21.vercel.app
      # Secrets — filled in during "New Blueprint" setup in the Render dashboard,
      # not stored in this file.
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
